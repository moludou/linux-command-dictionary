<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13774f">
<title>グラフとは？｜Fly-in 学習ノート</title>
<style>
:root {
  color-scheme: light;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  color: #233731;
  background: #e7ede9;
  --green: #13774f;
  --blue: #2467b8;
  --orange: #ce5b19;
  --line: #a9b6bc;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid #16162f; outline-offset: 3px; }
button:disabled { cursor: default; opacity: .43; }
.app {
  max-width: 548px; margin: 0 auto; background: #f1f4f2; min-height: 100vh;
  min-height: 100svh; display: flex; flex-direction: column;
  box-shadow: 0 0 0 1px #c9d4ce, 0 10px 46px #273e2a13;
}
header {
  min-height: 55px; display: grid; align-items: center; grid-template-columns: 74px 1fr 74px;
  padding: 3px 8px; background: var(--green); color: white;
}
h1 span { display: inline-block; }
h1 { text-align: center; font-size: 20px; margin: 0; }
.menu { border: 0; background: transparent; color: white; font-size: 14px; min-height: 44px; }
.mode { text-align: center; font-size: 14px; font-weight: 650; }
main { flex: 1; display: flex; flex-direction: column; }
figure { margin: 14px 16px 0; }
.board {
  position: relative; overflow: hidden; aspect-ratio: 1; width: min(100%, max(290px, 51svh));
  margin: auto; background: white; border: 1px solid #b5c3bf;
}
.lesson-map { display: block; width: 100%; max-width: 455px; height: auto; margin: auto; background: #fff; border: 1px solid #b5c3bf; border-radius: 5px; }
.branch { display: block; width: fit-content; margin: 10px 0 0; padding: 7px 0; color: #1a5e44; text-underline-offset: 3px; }
.entry.elective { margin-left: 18px; width: calc(100% - 18px); border-left: 3px solid #4e7964; }
.node {
  position: absolute; width: 12%; aspect-ratio: 1; transform: translate(-50%, -50%);
  display: grid; place-items: center; border-radius: 50%; background: #446b9c; color: white;
  font: 700 clamp(20px, 5vw, 28px)/1 "Trebuchet MS", system-ui, sans-serif;
  transition: background-color .32s, box-shadow .32s;
}
.node small {
  position: absolute; top: calc(100% + 6px); color: #304653; font-size: 14px;
  font-weight: 650; background: white; white-space: nowrap;
}
.node.active { background: #9e4216; box-shadow: 0 0 0 3px white, 0 0 0 5px var(--orange); }
.node.trail { background: #a74b20; }
.node.neighbour { background: #35754a; }
.track {
  position: absolute; height: 5px; border-radius: 3px; transform-origin: left center;
  background: var(--line); margin-top: -2.5px;
}
.track::after {
  display: block; content: ""; width: 100%; height: 100%; background: var(--orange);
  transform-origin: left center; transform: scaleX(0); transition: transform .48s ease;
}
.track.lit::after { transform: scaleX(1); }
.edge-name {
  position: absolute; left: 31%; top: 38%; transform: translate(-50%, -50%);
  background: white; border: 1px solid #a74b20; border-radius: 5px;
  padding: 2px 8px; font-size: 15px; color: #79360e; font-weight: 700;
}
.flight {
  position: absolute; width: 7%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border-radius: 50%; background: #924014; color: #fff; border: 2px solid white;
  display: grid; place-items: center; font: 750 clamp(10px, 3vw, 15px)/1 system-ui;
  box-shadow: 0 0 0 1px #924014;
}
figcaption { margin: 18px auto 20px; max-width: 475px; }
.progress { margin: 0 0 7px; color: #546b60; font-size: 14px; font-variant-numeric: tabular-nums; }
h2 { font-size: clamp(20px, 4vw, 24px); margin: 0 0 6px; line-height: 1.5; }
.explain { margin: 0; font-size: 17px; line-height: 1.75; }
footer {
  margin-top: auto; padding: 10px 16px max(14px, env(safe-area-inset-bottom));
  display: grid; grid-template-columns: 56px 72px 1fr; gap: 8px;
}
footer button { border: 0; color: #fff; border-radius: 6px; min-height: 48px; font-weight: 700; }
#first { background: #9c5215; }
#back { background: var(--green); }
#next { background: var(--blue); font-size: 18px; letter-spacing: .04em; }
.contents { padding: 24px 16px; }
.contents p { color: #52665e; }
.toc { display: grid; gap: 10px; margin-top: 20px; }
.entry { text-decoration: none; }
.entry span { display: grid; gap: 4px; }
.entry small { font-size: 14px; color: #486456; }
.entry:focus-visible, .home:focus-visible { outline: 3px solid #2759a3; outline-offset: 2px; }
.home { display: inline-block; color: #225d45; margin-top: 20px; padding: 8px 0; }
#note { margin: 10px 0 0; padding: 7px 12px; border-left: 3px solid var(--green); background: #e4ede7; font-size: 15px; line-height: 1.6; }
.flight[data-number="2"] { background:#254e94; box-shadow:0 0 0 1px #254e94; }
#next { padding: 8px; }
.entry { width: 100%; padding: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #b7c8be; border-radius: 5px; background: white; color: #204937; font-weight: bold; text-align: left; }
.entry small { font-weight: normal; }
@media (max-height: 620px) and (min-width: 600px) {
  .board { width: min(100%, 47svh); }
  figcaption { margin: 8px auto 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::after { transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="menu" id="menu" aria-label="目次を開く">‹ 目次</button>
  <h1 id="title">グラフとは？</h1><span class="mode" id="mode">学習</span>
</header>
<section class="contents" id="contents" hidden aria-label="学習項目">
  <h2>Fly-inを基礎から学ぶ</h2>
  <p>各ページの「Step」を押すと、図と解説が一つずつ進みます。</p>
  <nav id="topics" class="toc" aria-label="教材一覧"></nav>
  <a class="home" href="../">コードとコマンドの辞典へ戻る</a>
</section>
<main id="reader">
  <figure>
    <div class="board" id="board" role="img" aria-label="4つの点と、それらを結ぶ4本の線"></div>
    <svg id="lesson-map" class="lesson-map" viewBox="0 0 360 304" role="img" hidden></svg>
    <figcaption aria-live="polite" aria-atomic="true">
      <p class="progress" id="progress"></p>
      <h2 id="heading">グラフは、もの同士のつながりを表す</h2>
      <p class="explain" id="explanation"></p>
      <p id="note" hidden></p>
      <a class="branch" id="branch" hidden></a>
    </figcaption>
  </figure>
  <footer aria-label="解説の操作">
    <button id="first" aria-label="先頭に戻る" title="先頭に戻る">先頭</button>
    <button id="back" aria-label="1ステップ戻る">戻る</button>
    <button id="next" aria-label="次のステップ">Step</button>
  </footer>
</main>
<noscript>図解を再生するにはJavaScriptを有効にしてください。</noscript>
</div>
<script src="./lessons.js?v=41"></script>
<script src="./advanced-lessons.js?v=39"></script>
<script src="./diagrams.js?v=41"></script>
<script>
'use strict';
const get = id => document.getElementById(id);
const places = {
  S: {x: 16, y: 54, label: '出発地'}, A: {x: 46, y: 22},
  B: {x: 53, y: 76}, G: {x: 84, y: 42, label: '目的地'}
};
const tracks = ['SA', 'SB', 'AG', 'BG'];
const stationNames = {S:'港駅', A:'森駅', B:'川駅', G:'丘駅'};
const diagramDescriptions = {
  graph:'4つの点があります。左の点から上と下の点に線が伸び、その2つの点から右の点へ線が続いています。',
  terms:'左の点に「頂点」、その点と上の点を結ぶ線に「辺」という名前が付いています。',
  stations:'港駅と森駅、港駅と川駅、森駅と丘駅、川駅と丘駅がそれぞれ線で結ばれています。港駅と森駅を結ぶ線が強調されています。',
  flight:'出発地はS、目的地はGです。SからはAとBに通路が伸び、AとBからはそれぞれGに通路が続いています。'
};
const graphPages = [
  {diagram:'graph', title:'グラフは、もの同士のつながりを表す', text:'一つひとつのものを点で表し、関係のあるもの同士を線で結びます。このように、何と何がつながっているかを表したものを「グラフ」と呼びます。'},
  {diagram:'terms', title:'点を「頂点」、線を「辺」と呼ぶ', text:'左の点を一つ見てみましょう。これが「頂点」です。そこから上の点まで伸びる線が、二つの頂点を結ぶ「辺」です。この図には頂点が4つ、辺が4本あります。', active:'S', edges:['SA']},
  {diagram:'stations', title:'駅のつながりもグラフで表せる', text:'同じ図の点に駅名を付けてみましょう。ここでは、隣り合う駅を線で結んでいます。港駅と森駅の間には線が1本あるので、途中にほかの駅がないと分かります。', edges:['SA'], trail:['S','A']},
  {title:'ドローンが飛ぶ地図', text:'今度は、同じ図でドローンの通り道を表してみましょう。左のSが出発地、右のGが目的地です。ドローンは、丸と丸を結ぶ線に沿って飛びます。'},
  {title:'丸は一つの場所を表す', text:'枠で囲んだSを見てください。この丸は、ドローンの出発地を表しています。Fly-inではこうした場所を「ゾーン」と呼び、図の上でそれを表す点を「頂点」と呼びます。', active:'S'},
  {title:'線は二つの場所を結ぶ', text:'オレンジ色の線は、SとAを結ぶ通路です。SからAへも、AからSへも飛べます。このように、二つの頂点を結ぶ線を「辺」と呼びます。', edges:['SA'], trail:['S','A']},
  {title:'Sから直接行ける場所', text:'Sから伸びる線をたどると、上の線はAに、下の線はBにつながっています。Sから通路を1本だけ通って行けるのは、この2か所です。', edges:['SA','SB'], active:'S', adjacent:['A','B']},
  {title:'ドローンがSを出発する', text:'図の「D1」はドローンの名前です。D1の動きを見てみましょう。まずは上の通路を通って、SからAへ飛びます。', edges:['SA'], active:'A', trail:['S'], move:'SA'},
  {title:'Aを通って目的地へ', text:'D1はAからGへ進み、目的地に着きました。通った順に並べると、S → A → Gです。このように、どこを通って目的地まで行くかを示す道筋を「経路」と呼びます。', edges:['SA','AG'], active:'G', trail:['S','A'], move:'AG'},
  {title:'グラフを見ると、別の道も分かる', text:'今度は下の線をたどってみましょう。SからBを通っても、同じGに着きます。この地図のように、点と線でつながりを表したものが「グラフ」です。', edges:['SB','BG'], trail:['S','B','G']}
];
const coreTopics = flyInLessons.filter(topic => topic.id !== 'dfs');
const course = [...coreTopics, ...advancedLessons, flyInLessons.find(topic => topic.id === 'dfs')];
const directory = course.flatMap(topic => topic.id === 'dijkstra' ? [topic, aStarLesson] : [topic]);
const diagramTopics = new Set(['map-file', 'dijkstra', ...advancedLessons.map(topic => topic.id), aStarLesson.id]);
function nextTopic() {
  const current = lesson === aStarLesson ? 'dijkstra' : lesson.id;
  return course[course.findIndex(topic => topic.id === current) + 1];
}
const board = get('board');
const lines = new Map();
const nodes = new Map();
for (const pair of tracks) {
  const [a,b] = [...pair].map(key => places[key]);
  const line = document.createElement('div');
  line.className = 'track';
  line.style.left = a.x + '%';
  line.style.top = a.y + '%';
  line.style.width = Math.hypot(b.x-a.x,b.y-a.y) + '%';
  line.style.transform = 'rotate(' + Math.atan2(b.y-a.y,b.x-a.x) + 'rad)';
  board.append(line);
  lines.set(pair,line);
}
for (const [key,point] of Object.entries(places)) {
  const node = document.createElement('div');
  node.className = 'node';
  const symbol = document.createElement('span');
  const label = document.createElement('small');
  node.append(symbol, label);
  node.style.left = point.x + '%';
  node.style.top = point.y + '%';
  board.append(node); nodes.set(key,node);
}
const edgeName = document.createElement('span');
edgeName.className = 'edge-name';
edgeName.textContent = '辺';
board.append(edgeName);
const fleetMarkers = [1, 2].map(number => {
  const marker = document.createElement('span');
  marker.className = 'flight';
  marker.dataset.number = number;
  marker.textContent = number;
  marker.hidden = true;
  board.append(marker);
  return marker;
});
function displayFleet(page) {
  fleetMarkers.forEach((marker, index) => {
    marker.getAnimations().forEach(animation => animation.cancel());
    marker.hidden = !page.fleet;
    if (!page.fleet) return;
    const position = positions => {
      const place = places[positions[index]];
      const offset = index === 0 ? -5 : 5;
      return {left:(place.x+offset)+'%', top:(place.y-8)+'%'};
    };
    const to = position(page.fleet);
    Object.assign(marker.style,to);
    if (page.from && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      marker.animate([position(page.from),to],{duration:750,easing:'ease-in-out'});
    }
  });
}
const drone = document.createElement('span');
drone.className='flight';
drone.textContent='D1';
board.append(drone);
let step = 0;
let movement;
let lesson;
let pages = graphPages;
function flightPosition(key) {
  const point = places[key];
  return {left: point.x+'%', top:(point.y-8)+'%'};
}
function drawBaseMap(page) {
  const diagram = page.diagram ?? 'flight';
  board.setAttribute('aria-label', diagramDescriptions[diagram]);
  edgeName.hidden = diagram !== 'terms';
  displayFleet(page);
  for (const [key,line] of lines) line.classList.toggle('lit',page.edges?.includes(key) ?? false);
  for (const [key,node] of nodes) {
    const [symbol, label] = node.children;
    symbol.textContent = diagram === 'flight' ? key : '';
    let caption = '';
    if (diagram === 'flight') caption = places[key].label ?? '';
    if (diagram === 'terms' && key === 'S') caption = '頂点';
    if (diagram === 'stations') caption = stationNames[key];
    if (page.labels) caption = page.labels[key] ?? '';
    label.textContent = caption;
    label.hidden = !caption;
    node.classList.toggle('active',page.active===key);
    node.classList.toggle('trail',page.trail?.includes(key) ?? false);
    node.classList.toggle('neighbour',page.adjacent?.includes(key) ?? false);
  }
  movement?.cancel();
  drone.hidden = !page.move;
  if (page.move) {
    const [from,to] = [...page.move].map(flightPosition);
    Object.assign(drone.style,to);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      movement=drone.animate([from,to],{duration:750,easing:'ease-in-out'});
    }
  }
}

function show(index) {
  step = index;
  const page = pages[step];
  const customMap = diagramTopics.has(lesson.id);
  board.hidden = customMap;
  const map = get('lesson-map');
  map.toggleAttribute('hidden', !customMap);
  if (customMap) lessonDiagram(map,lesson.id,page);
  else drawBaseMap(page);
  get('progress').textContent = (step+1) + ' / ' + pages.length;
  get('heading').textContent = page.title;
  get('explanation').textContent = page.text;
  get('note').hidden = !page.note;
  get('note').textContent = page.note ?? '';
  get('first').disabled = get('back').disabled = step===0;
  const last = step===pages.length-1;
  const nextLesson = nextTopic();
  const action = last ? (nextLesson ? '次へ：'+nextLesson.name : '目次に戻る') : 'Step';
  get('next').textContent = action;
  get('next').setAttribute('aria-label',last ? action : '次のステップ');
}
get('first').onclick = () => show(0);
get('back').onclick = () => show(Math.max(0,step-1));
get('next').onclick = () => {
  if (step < pages.length-1) { show(step+1); return; }
  location.hash = nextTopic()?.id ?? 'contents';
};
for (const topic of directory) {
  const link = document.createElement('a');
  link.className = 'entry';
  link.classList.toggle('elective',topic === aStarLesson);
  link.href = '#'+topic.id;
  const text = document.createElement('span');
  const name = document.createElement('strong');
  name.textContent = topic === aStarLesson ? '発展編　'+topic.name : topic.name;
  const summary = document.createElement('small');
  summary.textContent = topic.summary;
  text.append(name, summary); link.append(text); get('topics').append(link);
}
function navigate() {
  lesson = directory.find(item => '#'+item.id===location.hash);
  const inLesson = Boolean(lesson);
  get('contents').hidden = inLesson;
  get('reader').hidden = !inLesson;
  get('menu').style.visibility = inLesson ? 'visible' : 'hidden';
  const title = get('title');
  title.textContent = inLesson ? lesson.name : 'Fly-in 学習ノート';
  if (lesson?.titleParts) {
    title.replaceChildren(...lesson.titleParts.map(part => {
      const span = document.createElement('span');
      span.textContent = part;
      return span;
    }));
  }
  get('mode').textContent = inLesson ? '学習' : '目次';
  document.title = get('title').textContent+'｜コードとコマンドの辞典';
  if (inLesson) {
    const branch = get('branch');
    branch.hidden = lesson.id !== 'dijkstra' && lesson.id !== 'astar';
    if (!branch.hidden) {
      const elective = lesson.id === 'dijkstra';
      branch.href = elective ? '#astar' : '#dijkstra';
      branch.textContent = elective ? '発展編　A*（エースター）へ' : 'ダイクストラ法に戻る';
    }
    pages = lesson.pages ?? graphPages;
    show(0);
  }
  window.scrollTo(0,0);
}
get('menu').onclick = () => { location.hash = 'contents'; };
window.addEventListener('hashchange', () => {
  navigate();
  (lesson ? get('next') : get('topics').querySelector('a')).focus({preventScroll:true});
});
navigate();
</script>
<script src="../hub.js"></script>
</body>
</html>
