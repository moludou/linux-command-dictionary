<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta name="description" content="スマホで引ける、Linuxコマンドの日本語辞典">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Linux辞典">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Linux コマンド辞典</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --surface: #0d1923;
      --surface-2: #122331;
      --line: #203745;
      --text: #edf7f5;
      --muted: #91aaa8;
      --accent: #79efc0;
      --accent-2: #49c99a;
      --safe: #6fe3a6;
      --change: #ffd166;
      --danger: #ff7b7b;
      --shadow: 0 18px 50px rgba(0, 0, 0, .38);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% -10%, rgba(73, 201, 154, .15), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom));
    }

    header {
      padding: 28px 2px 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font: 700 .72rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 8vw, 2.55rem);
      line-height: 1.18;
      letter-spacing: -.04em;
    }

    .lead {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .93rem;
    }

    .search-wrap {
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 5;
      padding: 8px 0 10px;
      background: linear-gradient(var(--bg) 72%, transparent);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(13, 25, 35, .94);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .2);
      backdrop-filter: blur(14px);
    }

    .search:focus-within {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(73, 201, 154, .12);
    }

    .search svg { flex: 0 0 auto; color: var(--muted); }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
    }

    .search input::placeholder { color: #718988; }

    .filters {
      display: flex;
      gap: 8px;
      margin: 2px -16px 18px;
      padding: 0 16px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }

    .filter[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #052318;
      font-weight: 800;
    }

    .result-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 2px 10px;
    }

    .result-meta h2 { margin: 0; font-size: 1rem; }
    .result-meta span { color: var(--muted); font-size: .82rem; }

    .command-list {
      display: grid;
      gap: 10px;
    }

    .command-card {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 17px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, var(--surface), #0b1620);
      box-shadow: 0 7px 24px rgba(0, 0, 0, .14);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .command-card:active { transform: scale(.985); }
    .command-card:hover { border-color: #365666; }

    .command-name {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }

    .command-name code {
      color: var(--accent);
      font: 800 1.18rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .category {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
    }

    .summary { margin: 0; color: #bfd0cf; font-size: .9rem; }

    .chevron {
      align-self: center;
      color: var(--muted);
      font-size: 1.4rem;
    }

    .empty {
      padding: 44px 18px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
    }

    .bottom-nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 7;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: min(100%, 720px);
      min-height: 66px;
      margin: auto;
      padding: 7px 14px calc(7px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(7, 16, 24, .94);
      backdrop-filter: blur(18px);
    }

    .nav-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-button.active { color: var(--accent); }
    .nav-button span { display: block; font-size: 1.15rem; line-height: 1.2; }

    dialog {
      width: 100%;
      max-width: none;
      height: 100dvh;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: var(--bg);
      color: var(--text);
    }

    dialog::backdrop { background: rgba(0, 0, 0, .74); }

    .detail-shell {
      width: min(100%, 720px);
      min-height: 100%;
      margin: 0 auto;
      padding: calc(10px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));
    }

    .detail-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 -4px;
      padding: 6px 4px 12px;
      background: linear-gradient(var(--bg) 75%, transparent);
    }

    .icon-button {
      width: 46px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      cursor: pointer;
    }

    .detail-head { padding: 20px 2px 18px; }

    .detail-head h2 {
      margin: 4px 0 3px;
      color: var(--accent);
      font: 850 clamp(2.4rem, 14vw, 4rem)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: -.07em;
    }

    .detail-head p { margin: 10px 0 14px; color: #d2e0df; }

    .risk {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 800;
    }

    .risk::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .risk.safe { color: var(--safe); }
    .risk.change { color: var(--change); }
    .risk.danger { color: var(--danger); }

    .syntax-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin: 4px 0 16px;
      padding: 16px;
      border: 1px solid #2a4b57;
      border-radius: var(--radius);
      background: #07151d;
    }

    .syntax-card code {
      overflow-wrap: anywhere;
      color: var(--accent);
      font: 700 .94rem/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .copy-button {
      min-width: 68px;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
      cursor: pointer;
      font-size: .82rem;
      font-weight: 800;
    }

    details {
      margin: 10px 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      overflow: hidden;
    }

    summary {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 800;
      list-style: none;
    }

    summary::-webkit-details-marker { display: none; }
    summary::after { color: var(--accent); content: "+"; font-size: 1.25rem; }
    details[open] > summary::after { content: "−"; }

    .detail-content {
      padding: 0 16px 16px;
      color: #c2d2d1;
      font-size: .92rem;
    }

    .detail-content p { margin: 6px 0; }
    .detail-content ul { margin: 6px 0 0; padding-left: 1.25rem; }
    .detail-content li + li { margin-top: 7px; }

    .token-list {
      display: grid;
      gap: 8px;
      margin: 0;
    }

    .token-row {
      display: grid;
      grid-template-columns: minmax(76px, auto) 1fr;
      gap: 12px;
      align-items: baseline;
      padding: 9px 0;
      border-bottom: 1px solid rgba(32, 55, 69, .75);
    }

    .token-row:last-child { border-bottom: 0; }
    .token-row code { color: var(--accent); font-weight: 800; overflow-wrap: anywhere; }

    .token-item {
      margin: 0;
      border: 0;
      border-bottom: 1px solid rgba(32, 55, 69, .75);
      border-radius: 0;
      background: transparent;
      overflow: visible;
    }

    .token-item:last-child { border-bottom: 0; }

    .token-item > .token-row {
      width: 100%;
      grid-template-columns: minmax(76px, auto) 1fr auto;
      padding: 9px 2px;
      border-bottom: 0;
      text-align: left;
    }

    .token-item > .token-row::after {
      align-self: center;
      margin-left: 4px;
    }

    .token-item[open] > .token-row { padding-bottom: 7px; }

    .token-example {
      margin: 0 0 10px;
      padding: 11px 12px;
      border-radius: 12px;
      background: #07151d;
    }

    .token-example-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
    }

    .token-example code {
      display: block;
      color: var(--accent);
      font: 700 .86rem/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
    }

    .token-example small { display: block; margin-top: 5px; color: var(--muted); }

    .token-output-guide {
      margin: 10px 0 0;
      border: 1px solid rgba(32, 55, 69, .9);
      border-radius: 10px;
      background: rgba(13, 25, 35, .72);
    }

    .token-output-guide > summary {
      min-height: 42px;
      padding: 0 10px;
      color: #c2d2d1;
      font-size: .78rem;
    }

    .token-output-guide-content {
      padding: 0 10px 10px;
      color: var(--muted);
      font-size: .78rem;
    }

    .token-output-guide-content p { margin: 2px 0; }

    .token-shell-label {
      display: block;
      margin: 2px 0 5px;
      color: #c2d2d1;
      font-weight: 800;
    }

    .token-shell-output {
      margin: 0;
      padding: 9px 10px;
      border: 1px solid rgba(32, 55, 69, .9);
      border-radius: 8px;
      background: #050d13;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .token-shell-output code {
      color: #d7e5e4;
      font-weight: 500;
    }

    .token-output-notes {
      margin: 9px 0 0;
      padding-left: 1.15rem;
    }

    .token-output-notes li + li { margin-top: 5px; }

    .token-example-entry + .token-example-entry {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(32, 55, 69, .75);
    }

    .example {
      margin: 9px 0;
      padding: 12px;
      border-radius: 12px;
      background: #07151d;
    }

    .example code {
      display: block;
      color: var(--accent);
      font: 700 .86rem/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
    }

    .example small { display: block; margin-top: 6px; color: var(--muted); }

    .related {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .related button {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--accent);
      cursor: pointer;
      font: 800 .84rem ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .toast {
      position: fixed;
      bottom: calc(82px + env(safe-area-inset-bottom));
      left: 50%;
      z-index: 20;
      padding: 10px 15px;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      box-shadow: var(--shadow);
      font-size: .84rem;
      font-weight: 800;
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 740px) {
      .app { padding-inline: 24px; }
      .command-list { grid-template-columns: 1fr 1fr; }
      dialog {
        width: min(680px, calc(100% - 48px));
        height: min(820px, calc(100dvh - 48px));
        margin: auto;
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }
      .bottom-nav { border-right: 1px solid var(--line); border-left: 1px solid var(--line); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Pocket reference</p>
      <h1>Linux コマンド辞典</h1>
      <p class="lead">意味・影響・注意点を、スマホですばやく確認。</p>
    </header>

    <div class="search-wrap">
      <label class="search" for="searchInput">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="例：コピー、権限、IP、grep" autocomplete="off">
      </label>
    </div>

    <div class="filters" id="filters" aria-label="カテゴリー"></div>

    <div class="result-meta">
      <h2 id="sectionTitle">コマンド一覧</h2>
      <span id="resultCount"></span>
    </div>

    <section class="command-list" id="commandList" aria-live="polite">
      <div class="empty" id="staticFallback">
        <strong style="color: var(--text)">内部コマンド</strong><br>
        alias / cd / command / env / exit / export / help / history / pwd / read / source / type / unalias
        <br><small>この表示のまま操作できない場合は、スマホのファイルプレビューがJavaScriptを制限しています。HTMLをSafariまたはChromeで開いてください。</small>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <button class="nav-button active" id="allNav" type="button"><span>⌂</span>辞典</button>
    <button class="nav-button" id="favoriteNav" type="button"><span>☆</span>お気に入り</button>
  </nav>

  <dialog id="detailDialog" aria-labelledby="detailTitle">
    <article class="detail-shell">
      <div class="detail-bar">
        <button class="icon-button" id="closeDetail" type="button" aria-label="詳細を閉じる">←</button>
        <button class="icon-button" id="favoriteButton" type="button" aria-label="お気に入りに追加">☆</button>
      </div>
      <div id="detailBody"></div>
    </article>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const commands = [
      {
        name: "ls",
        category: "内部コマンド",
        summary: "ファイルやディレクトリの一覧を表示する",
        keywords: "一覧 中身 確認 隠しファイル 詳細",
        risk: "safe",
        riskLabel: "確認のみ・変更なし",
        syntax: "ls [オプション] [対象]",
        tokens: [
          ["ls", "list の略。指定した場所の中身を一覧表示します。"],
          ["-l", "権限・所有者・サイズ・更新日時などを詳しく表示します。"],
          ["-a", ". で始まる隠しファイルも含めて表示します。"],
          ["-h", "-l と組み合わせ、サイズを KB・MB・GB など読みやすい単位で表示します。"],
          ["-t", "更新日時が新しい順に並べます。"],
          ["-S", "ファイルサイズが大きい順に並べます。"],
          ["-r", "現在の並び順を逆にします。"],
          ["-R", "下位ディレクトリの中身も再帰的に表示します。"],
          ["-d", "ディレクトリの中身ではなく、ディレクトリ自体の情報を表示します。"],
          ["-F", "種類が分かる記号を名前の末尾に付けます。例：ディレクトリは /。"],
          ["対象", "調べるディレクトリ。省略すると現在いる場所です。"]
        ],
        examples: [
          ["ls", "現在いる場所の中身を表示"],
          ["ls -la /var/log", "/var/log の中身を、隠しファイルを含めて詳しく表示"]
        ],
        changes: "何も変更しません。ファイルやディレクトリの情報を読み取って表示するだけです。",
        caution: "表示権限のない場所では「Permission denied」と表示されることがありますが、ファイルが壊れたわけではありません。",
        output: "先頭の文字列は種類と権限、その後にリンク数・所有者・グループ・サイズ・更新日時・名前が並びます。",
        related: ["cd", "grep"]
      },
      {
        name: "cd",
        category: "ファイル",
        summary: "現在いるディレクトリを移動する",
        keywords: "移動 場所 ディレクトリ フォルダ home",
        risk: "safe",
        riskLabel: "現在地のみ変更",
        syntax: "cd [移動先]",
        tokens: [
          ["cd", "change directory の略。作業中の場所を変更します。"],
          ["移動先", "移動したいディレクトリのパスです。"],
          ["..", "1つ上のディレクトリを表します。"],
          ["~", "自分のホームディレクトリを表します。"],
          ["-", "直前にいたディレクトリへ戻ります。"],
          ["/", "ファイルシステムの最上位であるルートディレクトリへ移動します。"],
          ["cd", "移動先を省略すると、自分のホームディレクトリへ移動します。"],
          ["-L", "シンボリックリンクを論理的にたどります。通常はこちらが既定です。"],
          ["-P", "シンボリックリンクの実体をたどり、物理的なパスを使用します。"]
        ],
        examples: [
          ["cd /var/log", "/var/log へ移動"],
          ["cd ..", "1つ上のディレクトリへ移動"]
        ],
        changes: "ファイルは変更しません。現在のシェルが基準にする作業場所だけが変わります。",
        caution: "移動先を間違えてもファイルは消えません。pwd で現在地を確認できます。",
        output: "成功した場合は通常何も表示しません。移動できない場合だけ理由が表示されます。",
        related: ["ls"]
      },
      {
        name: "cp",
        category: "ファイル",
        summary: "ファイルやディレクトリをコピーする",
        keywords: "複製 コピー バックアップ",
        risk: "change",
        riskLabel: "ファイルを作成・上書き",
        syntax: "cp [オプション] コピー元 コピー先",
        tokens: [
          ["cp", "copy の略。元を残したまま複製します。"],
          ["-r", "ディレクトリとその中身をまとめてコピーします。"],
          ["-i", "上書き前に確認します。"],
          ["-n", "コピー先に同名ファイルがある場合、上書きしません。"],
          ["-u", "コピー元の方が新しい場合、またはコピー先がない場合だけコピーします。"],
          ["-v", "処理したファイル名を表示します。"],
          ["-p", "更新日時・アクセス権限・所有者などを可能な範囲で保持します。"],
          ["-a", "ディレクトリ構造や属性、シンボリックリンクをできるだけ保って複製します。"],
          ["コピー元", "複製するファイルやディレクトリです。"],
          ["コピー先", "新しいコピーを置く場所または名前です。"],
          ["複数のコピー元", "最後の引数をディレクトリにすると、複数の対象をまとめてコピーできます。"]
        ],

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

      `).join("");
    }

    function normalized(value) {
      return value.toLocaleLowerCase("ja").replace(/\s+/g, " ").trim();
    }

    function visibleCommands() {
      const query = normalized(state.query);
      return commands.filter(command => {
        const inCategory = state.category === "すべて"
          || command.category === state.category
          || command.relatedCategories?.includes(state.category);
        const inFavorites = !state.favoritesOnly || state.favorites.has(command.name);
        const haystack = normalized(`${command.name} ${command.category} ${(command.relatedCategories || []).join(" ")} ${command.summary} ${command.keywords}`);
        return inCategory && inFavorites && (!query || haystack.includes(query));
      });
    }

    function outputExampleFor(command, token, description) {
      const specific = tokenOutputExamples[`${command.name}|${token}`];
      const shell = specific?.shell || commandShellSamples[command.name];
      const existingNotes = specific?.notes || [];
      const readingGuide = commandOutputReadingGuides[command.name] || [];
      const contextualNotes = [
        ["この指定で変わる点", `${token}：${description}`],
        ...readingGuide,
        ["最終確認", command.output]
      ];
      const noteKeys = new Set(existingNotes.map(([line]) => line));
      return {
        shell,
        notes: [...existingNotes, ...contextualNotes.filter(([line]) => !noteKeys.has(line))]
      };
    }

    function concreteToken(token) {
      const firstAlternative = token.includes(" / ") ? token.split(" / ")[0] : token;
      return firstAlternative
        .replace("-O0〜-O3", "-O2")
        .replace("-行数", "-20")
        .replace(/パス/g, "/tmp/example")
        .replace(/ユーザー名|ユーザー/g, "alice")
        .replace(/グループ一覧|グループ名|グループ/g, "developers")
        .replace(/文字列|文章|コメント/g, "'example'")
        .replace(/名前=値/g, "limit=10")
        .replace(/新branch|branch名|branch/g, "feature/example")
        .replace(/新名前/g, "new-name")
        .replace(/名前/g, "example")
        .replace(/区切り/g, "':'")
        .replace(/タグ/g, "UUID")
        .replace(/ラベル/g, "DATA")
        .replace(/UUID/g, "1234-ABCD")
        .replace(/DIR/g, "build")
        .replace(/日数/g, "30")
        .replace(/日付/g, "2026-12-31")
        .replace(/日時|時刻/g, "'1 hour ago'")
        .replace(/参照元/g, "reference.txt")
        .replace(/生成器/g, "Ninja")
        .replace(/回数/g, "3")
        .replace(/行数/g, "20")
        .replace(/文字数/g, "10")
        .replace(/byte数/g, "1024")
        .replace(/秒/g, "5")
        .replace(/数/g, "4")
        .replace(/種類/g, "ext4")
        .replace(/列/g, "NAME,SIZE,FSTYPE")
        .replace(/権限/g, "755")
        .replace(/番号/g, "3")
        .replace(/ポート/g, "2222")
        .replace(/鍵ファイル|鍵/g, "~/.ssh/id_ed25519")
        .replace(/GID/g, "1001")
        .replace(/KEY=VALUE/g, "PASS_MAX_DAYS=90")
        .replace(/shell/g, "/bin/bash")
        .replace(/ホーム/g, "/home/alice")
        .replace(/パターン/g, "'*.log'")
        .replace(/サービス/g, "files")
        .replace(/機器名/g, "eth0")
        .replace(/インターフェース/g, "eth0")
        .replace(/相手/g, "example-host")
        .replace(/PID/g, "1234")
        .replace(/版/g, "1.2.0");
    }

    function generatedArgumentExample(command, token) {
      const override = argumentExampleOverrides[`${command.name}|${token}`];
      if (override) return override;

      const value = concreteToken(token)
        .replace(/URL/g, "https://github.com/example/project.git")
        .replace(/メッセージ/g, "'Update notes'")
        .replace(/対象/g, "README.md")
        .replace(/宛先/g, "8.8.8.8")
        .replace(/IP/g, "192.0.2.10")
        .replace(/PORT/g, "22");

      if (command.name === "apt") {
        return ["update", "upgrade", "autoremove"].includes(token)
          ? `sudo apt ${value}` : `sudo apt ${value} nginx`;
      }
      if (command.name === "git") return `git ${value}`;
      if (command.name === "git remote") return `git remote ${value}`;
      if (command.name === "git stash") return `git stash ${value}`;
      if (command.name === "systemctl") {
        if (token === "systemctl") return "systemctl --version";
        if (token === "サービス名") return "systemctl status ssh";
        return `sudo systemctl ${value} ssh`;
      }
      if (command.name === "ufw") return `sudo ufw ${value}`;
      if (command.name === "tailscale") return `tailscale ${value}`;
      if (command.name === "pip") return `python3 -m pip ${value}`;
      if (command.name === "nmcli") return `nmcli ${value}`;
      if (command.name === "hostnamectl") return `hostnamectl ${value}`;
      if (command.name === "getent") return token === "キー" ? "getent passwd alice" : `getent ${value}`;
      if (command.name === "cd") return token === "cd" ? "cd" : `cd ${value}`;
      if (command.name === "chmod" && /^(640|u\+x|g-w|o=r|a\+r)$/.test(token)) return `chmod ${value} file.txt`;
      if (command.name === "ip") {
        if (["address", "route", "link", "neighbour"].includes(token)) return `ip ${value} show`;
        if (token === "show") return "ip address show";
        if (token === "ip") return "ip address show";
        if (token.startsWith("get ")) return `ip route ${value}`;
        if (token.startsWith("dev ")) return `ip address show ${value}`;
      }
      if (command.name === "git branch" && token === "引数なし") return "git branch";
      if (command.name === "git diff" && token === "引数なし") return "git diff";
      if (command.name === "git tag" && token === "引数なし") return "git tag";
      return null;
    }

    function tokenExampleFor(command, token, index, explicitExample) {
      if (explicitExample) return explicitExample;

      const override = tokenExampleOverrides[`${command.name}|${token}`];
      if (override) return [override, `${token}を指定した実行例です。`];

      const isOption = token.trim().startsWith("-");
      if (isOption && tokenExampleProfiles[command.name]) {
        const [prefix, suffix] = tokenExampleProfiles[command.name];
        const example = [prefix, concreteToken(token), suffix].filter(Boolean).join(" ");
        return [example, `${token}を指定した実行例です。`];
      }

      const generatedArgument = generatedArgumentExample(command, token);
      if (generatedArgument) return [generatedArgument, `${token}を指定した実行例です。`];

      const tokenWords = token.toLocaleLowerCase("ja").match(/[a-z0-9_.:@/+~-]+/g) || [];
      const matchingExample = command.examples.find(([example]) => {
        const normalizedExample = example.toLocaleLowerCase("ja");
        return tokenWords.some(word => word.length > 1 && normalizedExample.includes(word));
      });
      if (matchingExample) return [matchingExample[0], `${token}が使われている実行例です。`];

      const fallback = command.examples[index % command.examples.length];
      return [fallback[0], `このコマンド内での${token}の位置を確認する例です。`];
    }

        ? "お気に入り"

      resultCount.textContent = `${shown.length}件`;

      if (!shown.length) {
        commandList.innerHTML = `<div class="empty">該当するコマンドがありません。<br>別の言葉でも検索してみてください。</div>`;
        return;

      commandList.innerHTML = shown.map(command => `

          <summary>実行例</summary>
          <div class="detail-content">
            ${command.examples.map(([example, description]) => `
              <div class="example"><code>$ ${escapeHtml(example)}</code><small>${description}</small></div>
            `).join("")}
          </div>
        </details>

        <details>
          <summary>何が変わる？</summary>
          <div class="detail-content"><p>${command.changes}</p></div>
        </details>

        <details>
          <summary>実行結果の読み方</summary>
          <div class="detail-content"><p>${command.output}</p></div>
        </details>

        <details>
          <summary>注意点</summary>
          <div class="detail-content"><p>${command.caution}</p></div>
        </details>

        ${command.related.length ? `
          <details>
            <summary>関連コマンド</summary>
            <div class="detail-content related">
              ${command.related.map(name => `<button type="button" data-related="${name}">${name}</button>`).join("")}
            </div>
          </details>
        ` : ""}
      `;
    }

    function openCommand(name) {
      const command = commands.find(item => item.name === name);
      if (!command) return;
      renderDetail(command);
      if (!dialog.open) {
        if (typeof dialog.showModal === "function") {
          dialog.showModal();
        } else {
          dialog.setAttribute("open", "");
          dialog.style.display = "block";
        }
      }
      dialog.scrollTop = 0;
    }

    function saveFavorites() {
      storeFavorites([...state.favorites]);
      renderList();
    }

    function closeDialog() {
      if (typeof dialog.close === "function") {
        dialog.close();
      } else {
        dialog.removeAttribute("open");
        dialog.style.display = "none";
      }
    }

    async function copyText(value) {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        try {
          await navigator.clipboard.writeText(value);
          return;
        } catch (error) {
          // file://ではClipboard APIが拒否されることがあるため、下の方法へ切り替えます。
        }
      }

      const textArea = document.createElement("textarea");
      textArea.value = value;
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.select();
      textArea.setSelectionRange(0, textArea.value.length);
      const copied = document.execCommand("copy");
      textArea.remove();
      if (!copied) throw new Error("copy failed");
    }

    let toastTimer;
    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    filters.addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      state.category = button.dataset.category;
      state.favoritesOnly = false;
      document.querySelector("#favoriteNav").classList.remove("active");
      document.querySelector("#allNav").classList.add("active");
      renderFilters();
      renderList();
    });

    searchInput.addEventListener("input", event => {
      state.query = event.target.value;
      renderList();
    });

    commandList.addEventListener("click", event => {
      const card = event.target.closest("[data-command]");
      if (card) openCommand(card.dataset.command);
    });

    document.querySelector("#closeDetail").addEventListener("click", closeDialog);

    dialog.addEventListener("click", event => {
      const copyButton = event.target.closest("[data-copy]");
      if (copyButton) {
        copyText(copyButton.dataset.copy).then(
          () => showToast("コピーしました"),
          () => showToast("コピーできませんでした")
        );
      }

      const relatedButton = event.target.closest("[data-related]");
      if (relatedButton) openCommand(relatedButton.dataset.related);
    });

    favoriteButton.addEventListener("click", () => {
      if (!state.activeCommand) return;
      const name = state.activeCommand.name;
      if (state.favorites.has(name)) {
        state.favorites.delete(name);
        showToast("お気に入りから外しました");
      } else {
        state.favorites.add(name);
        showToast("お気に入りに追加しました");
      }
      saveFavorites();
      renderDetail(state.activeCommand);
    });

    document.querySelector("#allNav").addEventListener("click", () => {
      state.favoritesOnly = false;
      document.querySelector("#allNav").classList.add("active");
      document.querySelector("#favoriteNav").classList.remove("active");
      renderList();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.querySelector("#favoriteNav").addEventListener("click", () => {
      state.favoritesOnly = true;
      document.querySelector("#favoriteNav").classList.add("active");
      document.querySelector("#allNav").classList.remove("active");
      renderList();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    dialog.addEventListener("cancel", event => {
      event.preventDefault();
      closeDialog();
    });

    renderFilters();
    renderList();

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {
          // 辞典本体はService Workerなしでも利用できます。
        });
      });
    }
  </script>
</body>
</html>
