const $=id=>document.getElementById(id);
let group=0, index=0, elapsed=0, last=0, running=false, raf=0, drawn='';
const period=4100;
function render(){
 const scenes=lessons[group], s=scenes[index], n=s.frames.length;
 const f=Math.min(n-1,Math.floor(elapsed/110)), key=[group,index,f].join('.');
 if(key!==drawn){
  $('scene').innerHTML=s.frames[f];drawn=key;
  const labels=[...$('scene').querySelectorAll('text')].filter(t=>Number(t.getAttribute('y'))>=527).map(t=>t.textContent);
  $('scene').setAttribute('aria-label',labels.join('。'));
  $('caption').textContent=labels.slice(1).join(' ');
 }
 $('normal').setAttribute('aria-pressed',group===0);$('extra').setAttribute('aria-pressed',group===1);
 $('seek').max=scenes.length-1;$('seek').value=index;
 $('count').textContent=(index+1)+' / '+scenes.length;
 $('prev').disabled=index===0;$('next').disabled=index===scenes.length-1;
 $('play').textContent=running?'一時停止':(index===scenes.length-1?'もう一度':'再生');
}
function tick(ts){
 if(!running)return;
 if(last)elapsed+=(ts-last)*Number($('speed').value);
 last=ts;
 if(elapsed>=period){
  if(index<lessons[group].length-1){index++;elapsed=0;}
  else {running=false;elapsed=period;}
 }
 render();if(running)raf=requestAnimationFrame(tick);
}
function jump(i){running=false;cancelAnimationFrame(raf);last=0;index=i;elapsed=period;render();}
function toggle(){
 if(running){running=false;cancelAnimationFrame(raf);}
 else{if(index===lessons[group].length-1&&elapsed>=period)index=0;if(elapsed>=period)elapsed=0;running=true;last=0;raf=requestAnimationFrame(tick);}
 render();
}
$('normal').onclick=()=>{group=0;jump(0)};$('extra').onclick=()=>{group=1;jump(0)};
$('prev').onclick=()=>jump(index-1);$('next').onclick=()=>jump(index+1);
$('seek').oninput=e=>jump(Number(e.target.value));$('play').onclick=toggle;
render();
</script></html>
